name: EVOLUNE Android Emulator QA
on:
  pull_request:
    paths:
      - '.github/workflows/android-device-qa.yml'
      - 'core/data/**'
      - 'app/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest :app:assembleDebug --stacktrace --no-daemon
            mkdir -p qa/native_screenshots
            adb pull /sdcard/Pictures/EVOLUNE-QA/. qa/native_screenshots/
            python3 -c 'from pathlib import Path; names=("today","challenges","growth","journal","insights"); root=Path("qa/native_screenshots"); missing=[n for n in names if not (root / ("evolune_qa_"+n+".png")).is_file() or (root / ("evolune_qa_"+n+".png")).read_bytes()[:8] != bytes([137,80,78,71,13,10,26,10])]; assert not missing, "Missing or invalid native PNG: "+", ".join(missing)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolune-emulator-evidence
          path: |
            qa/native_screenshots/
            core/data/build/reports/androidTests/
            core/data/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
