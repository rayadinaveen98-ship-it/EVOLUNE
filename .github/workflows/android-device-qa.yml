name: EVOLUNE Android Emulator QA
on:
  pull_request:
    paths:
      - '.github/workflows/android-device-qa.yml'
      - 'core/data/**'
      - 'app/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle :core:data:connectedDebugAndroidTest :app:assembleDebug --stacktrace --no-daemon
            gradle :app:installDebug --no-daemon
            mkdir -p qa/native_screenshots
            adb shell am start -W -n studio.evolune.app/.MainActivity
            sleep 5
            adb exec-out screencap -p > qa/native_screenshots/today_first_launch.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolune-emulator-evidence
          path: |
            qa/native_screenshots/
            core/data/build/reports/androidTests/
            core/data/build/outputs/androidTest-results/
          if-no-files-found: warn
