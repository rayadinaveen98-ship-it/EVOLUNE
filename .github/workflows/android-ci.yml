name: EVOLUNE Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36 platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: JVM domain verification
        run: gradle :domain:compileKotlin --stacktrace
      - name: Compile Room and Android app / assemble debug
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: evolune-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
